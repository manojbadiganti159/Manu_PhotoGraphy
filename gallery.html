<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
function getGalleryFolder() {

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    if (folder) {
        return folder.replace(/\/+$/, "");
    }

    return "photos";

}

function getGalleryTitle(folder) {

    const parts = folder.split("/").filter(Boolean);
    const lastPart = parts[parts.length - 1] || "Gallery";

    return `${lastPart.toUpperCase()} GALLERY`;

}

async function loadGallery(folder = getGalleryFolder()) {

    const gallery = document.getElementById("gallery");
    const title = document.getElementById("gallery-title");

    if (title) {
        title.textContent = getGalleryTitle(folder);
    }

    gallery.innerHTML = `
        <p style="text-align:center;color:#D4AF37;">
            Loading gallery...
        </p>
    `;

    try {

        const encodedFolder = folder
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");

        const response = await fetch(`https://manuphotography.onrender.com/gallery/${encodedFolder}`);

        if (!response.ok) {
            throw new Error("Failed to load gallery");
        }

        const images = await response.json();

        gallery.innerHTML = "";

        images.forEach(item => {

            if (item.type === "image") {

            const a = document.createElement("a");
            a.href = item.url;
            a.className = "glightbox";

            const img = document.createElement("img");
            img.src = item.url;
            img.alt = item.id;
            img.loading = "lazy";

            a.appendChild(img);
            gallery.appendChild(a);

        } else {

            const video = document.createElement("video");

            video.src = item.url;
            video.controls = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = "metadata";

            gallery.appendChild(video);

        }

    });

        GLightbox({
            touchNavigation: true,
            loop: true,
            zoomable: true,
            openEffect: "zoom",
            closeEffect: "fade"
        });

    } catch (error) {

        gallery.innerHTML = `
            <p style="text-align:center;color:red;">
                Failed to load gallery.
            </p>
        `;

        console.error(error);

    }

}

loadGallery();


</script>

<script>
const menuToggle = document.querySelector('.menu-toggle');
const nav = document.querySelector('nav');
if (menuToggle && nav) {
  menuToggle.addEventListener('click', () => {
    const isOpen = nav.classList.toggle('open');
    document.body.classList.toggle('menu-open', isOpen);
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  document.addEventListener('click', (event) => {
    if (window.innerWidth <= 900 && nav.classList.contains('open') && !nav.contains(event.target) && !menuToggle.contains(event.target)) {
      nav.classList.remove('open');
      document.body.classList.remove('menu-open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
  });

  document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth <= 900) {
        nav.classList.remove('open');
        document.body.classList.remove('menu-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  });
}
</script>
